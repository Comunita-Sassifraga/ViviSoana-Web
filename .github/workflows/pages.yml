name: Deploy VIVI su GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vivi-github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v6
      - name: Leggi la configurazione Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Prepara i collegamenti della pagina 404
        env:
          VIVI_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python3 scripts/prepare-pages.py public "$VIVI_BASE_PATH"
      - name: Prepara le pagine statiche
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Distribuisci il sito
        id: deployment
        uses: actions/deploy-pages@v4
